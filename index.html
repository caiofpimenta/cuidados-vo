<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuidados da Vó</title>
<meta name="theme-color" content="#0B6E78">
<meta name="description" content="Controle compartilhado de pressão, glicemia e medicamentos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuidados da Vó">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app">
  <header class="top" id="top" hidden>
    <div>
      <div class="date" id="today-date">&nbsp;</div>
      <h1>Cuidados da Vó</h1>
      <div class="clock" id="clock">--:--</div>
    </div>
    <button class="who" id="who" type="button" aria-label="Ajustes"></button>
  </header>
  <main id="main" class="stack" aria-live="polite">
    <div class="notice">Abrindo…</div>
  </main>
</div>

<nav class="tabs" id="tabs" aria-label="Seções" hidden>
  <button type="button" data-tab="hoje" aria-current="page"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Hoje<span class="dot" id="dot" hidden></span></button>
  <button type="button" data-tab="hist"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 8v5l3 2"/></svg>Histórico</button>
  <button type="button" data-tab="meds"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg>Remédios</button>
  <button type="button" data-tab="rel"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/></svg>Relatório</button>
</nav>

<div class="ov" id="ov" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="firebase-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
